name: app_financas
description: "App de controle de finanças pessoais em Flutter com Firebase: receitas, despesas, categorias, dashboard e orçamentos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0

  # Estado e injeção de dependência
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.2.0

  # UI e formatação
  fl_chart: ^1.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
